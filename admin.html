<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AppSee Admin</title>
<link rel="icon" type="image/png" href="appsee.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#0b4fa8;--s:#1a7fd4;--light:#e8f0fc;--ink:#05203a;--muted:#5a7183;--line:#e1e9f1;--ok:#14803c;--warn:#b45309;--bad:#b91c1c;--grad:linear-gradient(135deg,var(--p),var(--s))}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',system-ui,sans-serif;background:#f4f8fc;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--s);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.65rem 1.3rem;border-radius:999px;border:2px solid transparent;font:600 .9rem 'Poppins',sans-serif;background:var(--grad);color:#fff;cursor:pointer;transition:transform .2s,opacity .2s}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:#fff;color:var(--p);border-color:var(--p)}
.btn.sm{padding:.4rem .9rem;font-size:.8rem}
.btn.danger{background:#fff;color:var(--bad);border-color:#f0c4c4}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:linear-gradient(135deg,var(--light),#f4f8fc)}
.login form{width:min(26rem,100%);background:#fff;border:1px solid var(--line);border-radius:1.2rem;padding:2rem;box-shadow:0 20px 50px rgba(5,32,58,.1)}
.login h1{font-size:1.5rem;margin-bottom:.3rem}
.login p.sub{color:var(--muted);font-size:.9rem;margin-bottom:1.3rem}
label{display:block;font-size:.8rem;font-weight:600;margin:.9rem 0 .3rem}
input,select{width:100%;padding:.7rem .85rem;border:1px solid #c9d7e3;border-radius:.65rem;font:400 .95rem 'Poppins',sans-serif;background:#fff;color:var(--ink)}
.login .btn{width:100%;margin-top:1.3rem}
.err{margin-top:1rem;padding:.7rem .9rem;border-radius:.6rem;background:#fdecec;color:#7f1d1d;font-size:.85rem}

/* dashboard */
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{max-width:76rem;margin:0 auto;padding:.8rem 1.2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.logo{font-weight:800;font-size:1.3rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.top small{color:var(--muted);margin-left:.5rem;font-size:.8rem}
.who{display:flex;align-items:center;gap:.8rem;font-size:.82rem;color:var(--muted)}
main{max-width:76rem;margin:0 auto;padding:1.4rem 1.2rem 3rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.8rem;margin-bottom:1.2rem}
.stat{background:#fff;border:1px solid var(--line);border-radius:.9rem;padding:.9rem 1rem}
.stat b{display:block;font-size:1.7rem;line-height:1.2}
.stat span{font-size:.8rem;color:var(--muted)}
.tools{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:1.1rem}
.tools input{flex:1 1 14rem}.tools select{flex:0 0 11rem}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(21rem,1fr));gap:1rem}
.lead{background:#fff;border:1px solid var(--line);border-radius:1rem;padding:1.1rem;display:flex;flex-direction:column;gap:.55rem;border-left:5px solid var(--s)}
.lead.new{border-left-color:var(--warn)}.lead.contacted{border-left-color:var(--s)}.lead.closed{border-left-color:var(--ok)}
.lead h3{font-size:1.05rem;display:flex;justify-content:space-between;gap:.5rem;align-items:baseline}
.lead time{font-size:.74rem;color:var(--muted);font-weight:400;white-space:nowrap}
.lead .row{font-size:.88rem;color:var(--muted);word-break:break-word}
.lead .row b{color:var(--ink);font-weight:600}
.lead a{color:var(--p);text-decoration:none}.lead a:hover{text-decoration:underline}
.msg{background:#f4f8fc;border-radius:.6rem;padding:.7rem .8rem;font-size:.88rem;white-space:pre-wrap;word-break:break-word;max-height:9rem;overflow:auto}
.acts{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.3rem}
.acts select{width:auto;padding:.4rem .6rem;font-size:.82rem}
.acts .grow{flex:1}
.empty{grid-column:1/-1;text-align:center;padding:3rem 1rem;color:var(--muted);background:#fff;border:1px dashed #c9d7e3;border-radius:1rem}
.toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1.2rem;border-radius:999px;font-size:.88rem;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.25)}
@media(min-width:1600px){html{font-size:112.5%}}@media(min-width:2200px){html{font-size:150%}}
@media(max-width:560px){.top small,.who span{display:none}.tools select{flex:1 1 100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section class="login" id="loginView" hidden>
  <form id="loginForm" novalidate>
    <div class="logo" style="font-size:1.8rem">AppSee</div>
    <h1>Admin sign in</h1>
    <p class="sub">View and manage messages from your website.</p>
    <label for="em">Email</label>
    <input id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div class="err" id="loginErr" role="alert" hidden></div>
    <button class="btn" id="loginBtn" type="submit">Sign in</button>
  </form>
</section>

<div id="dash" hidden>
  <header><div class="top">
    <div><span class="logo">AppSee</span><small>Admin</small></div>
    <div class="who"><span id="who"></span><button class="btn ghost sm" id="outBtn" type="button">Sign out</button></div>
  </div></header>
  <main>
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><span>Total messages</span></div>
      <div class="stat"><b id="sNew">0</b><span>New</span></div>
      <div class="stat"><b id="sToday">0</b><span>Today</span></div>
      <div class="stat"><b id="sDone">0</b><span>Closed</span></div>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="Search name, phone, email or message" aria-label="Search messages">
      <select id="fs" aria-label="Filter by status">
        <option value="all">All statuses</option><option value="new">New</option><option value="contacted">Contacted</option><option value="closed">Closed</option>
      </select>
      <button class="btn ghost" id="csvBtn" type="button">Download CSV</button>
    </div>
    <div class="list" id="list" aria-live="polite"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ADMIN = "appseeapps@gmail.com";
  firebase.initializeApp({
    apiKey: "AIzaSyD_0QOZq26WJHM3JZBGCzC4Ik_rxrwbyTY",
    authDomain: "appseeapp.firebaseapp.com",
    projectId: "appseeapp",
    storageBucket: "appseeapp.firebasestorage.app",
    messagingSenderId: "228305327553",
    appId: "1:228305327553:web:02e051da025846c500cb40"
  });
  var auth = firebase.auth(), db = firebase.firestore(), rows = [], unsub = null, tt;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function toast(t) { var el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(function () { el.hidden = true; }, 3200); }
  function when(r) { return r.createdAt && r.createdAt.toDate ? r.createdAt.toDate() : null; }
  function fmt(d) { return d ? d.toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" }) : "Just now"; }
  function status(r) { return r.status === "contacted" || r.status === "closed" ? r.status : "new"; }

  /* ----- sign in / out ----- */
  auth.onAuthStateChanged(function (u) {
    if (u && (u.email || "").toLowerCase() === ADMIN) {
      $("loginView").hidden = true; $("dash").hidden = false; $("who").textContent = u.email; listen();
    } else {
      if (unsub) { unsub(); unsub = null; }
      $("dash").hidden = true; $("loginView").hidden = false;
      if (u) { auth.signOut(); showErr("This account is not allowed to open the admin page."); }
    }
  });
  function showErr(t) { var e = $("loginErr"); e.textContent = t; e.hidden = !t; }
  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault(); showErr("");
    var b = $("loginBtn"); b.disabled = true; b.textContent = "Signing in…";
    auth.signInWithEmailAndPassword($("em").value.trim(), $("pw").value).catch(function (err) {
      var c = err && err.code || "";
      showErr(c.indexOf("network") > -1 ? "No internet connection. Please try again."
        : c.indexOf("too-many") > -1 ? "Too many attempts. Please wait a few minutes."
        : "Wrong email or password.");
    }).then(function () { b.disabled = false; b.textContent = "Sign in"; });
  });
  $("outBtn").addEventListener("click", function () { auth.signOut(); });

  /* ----- live data ----- */
  function listen() {
    if (unsub) return;
    unsub = db.collection("leads").orderBy("createdAt", "desc").limit(500).onSnapshot(function (snap) {
      rows = snap.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; });
      render();
    }, function () { toast("Could not load messages. Check your Firestore rules."); });
  }

  function filtered() {
    var q = $("q").value.trim().toLowerCase(), f = $("fs").value;
    return rows.filter(function (r) {
      if (f !== "all" && status(r) !== f) return false;
      return !q || [r.name, r.phone, r.email, r.message, r.service].join(" ").toLowerCase().indexOf(q) > -1;
    });
  }

  function render() {
    var today = new Date().toDateString();
    $("sTotal").textContent = rows.length;
    $("sNew").textContent = rows.filter(function (r) { return status(r) === "new"; }).length;
    $("sDone").textContent = rows.filter(function (r) { return status(r) === "closed"; }).length;
    $("sToday").textContent = rows.filter(function (r) { var d = when(r); return d && d.toDateString() === today; }).length;
    var list = filtered();
    $("list").innerHTML = list.length ? list.map(function (r) {
      var s = status(r), ph = String(r.phone || "").replace(/[^\d+]/g, "");
      return '<article class="lead ' + s + '" data-id="' + esc(r.id) + '">' +
        '<h3>' + esc(r.name) + '<time>' + esc(fmt(when(r))) + '</time></h3>' +
        '<div class="row"><b>Phone:</b> <a href="tel:' + esc(ph) + '">' + esc(r.phone) + '</a></div>' +
        '<div class="row"><b>Email:</b> <a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a></div>' +
        '<div class="row"><b>Needs:</b> ' + esc(r.service) + '</div>' +
        (r.message ? '<div class="msg">' + esc(r.message) + '</div>' : '') +
        '<div class="acts"><select data-act="status" aria-label="Status">' +
        ["new", "contacted", "closed"].map(function (o) { return '<option value="' + o + '"' + (o === s ? " selected" : "") + ">" + o.charAt(0).toUpperCase() + o.slice(1) + "</option>"; }).join("") +
        '</select><a class="btn ghost sm" href="mailto:' + esc(r.email) + '?subject=Re%3A%20your%20message%20to%20AppSee">Reply</a>' +
        '<span class="grow"></span><button class="btn danger sm" data-act="del" type="button">Delete</button></div></article>';
    }).join("") : '<div class="empty">' + (rows.length ? "No messages match your search." : "No messages yet. New messages from your website will appear here instantly.") + "</div>";
  }

  $("q").addEventListener("input", render);
  $("fs").addEventListener("change", render);

  $("list").addEventListener("change", function (e) {
    if (e.target.dataset.act !== "status") return;
    var id = e.target.closest(".lead").dataset.id;
    db.collection("leads").doc(id).update({ status: e.target.value })
      .then(function () { toast("Status updated"); })
      .catch(function () { toast("Could not update. Please try again."); render(); });
  });
  $("list").addEventListener("click", function (e) {
    if (e.target.dataset.act !== "del") return;
    var id = e.target.closest(".lead").dataset.id;
    if (!confirm("Delete this message permanently?")) return;
    db.collection("leads").doc(id).delete().then(function () { toast("Message deleted"); })
      .catch(function () { toast("Could not delete. Please try again."); });
  });

  /* ----- CSV export ----- */
  function cell(v) {
    v = String(v == null ? "" : v).replace(/\r?\n/g, " ");
    if (/^[=+\-@]/.test(v)) v = "'" + v;
    return '"' + v.replace(/"/g, '""') + '"';
  }
  $("csvBtn").addEventListener("click", function () {
    var list = filtered();
    if (!list.length) return toast("Nothing to download yet.");
    var out = [["Date", "Name", "Phone", "Email", "Needs", "Message", "Status"].join(",")].concat(list.map(function (r) {
      return [fmt(when(r)), r.name, r.phone, r.email, r.service, r.message, status(r)].map(cell).join(",");
    }));
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\ufeff" + out.join("\n")], { type: "text/csv;charset=utf-8" }));
    a.download = "appsee-messages-" + new Date().toISOString().slice(0, 10) + ".csv";
    a.click(); URL.revokeObjectURL(a.href);
  });
})();
</script>
</body>
</html>
